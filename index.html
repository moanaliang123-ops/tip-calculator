<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.2);
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #1a1a2e;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-size: 14px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 2px solid #e8e8e8;
            border-radius: 14px;
            font-size: 16px;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s;
            background: #fafafa;
            color: #1a1a2e;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        input[type="number"]::placeholder {
            color: #bbb;
            font-weight: 400;
        }

        .tip-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tip-btn {
            flex: 1;
            min-width: 60px;
            padding: 12px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            background: #fafafa;
            color: #555;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .tip-btn:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-1px);
        }

        .tip-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .people-input {
            padding-left: 16px !important;
        }

        button#calculate {
            width: 100%;
            padding: 16px;
            margin-top: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }

        button#calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        button#calculate:active {
            transform: translateY(0);
        }

        .error-area {
            margin-top: 16px;
            padding: 14px 16px;
            background: #fee;
            border-left: 4px solid #e74c3c;
            border-radius: 10px;
            color: #c0392b;
            font-size: 14px;
            font-weight: 500;
            display: none;
            animation: shake 0.4s;
        }

        .error-area.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        #result {
            margin-top: 24px;
            padding: 24px;
            background: linear-gradient(135deg, #f8f9ff 0%, #f0f2ff 100%);
            border-radius: 16px;
            border: 1px solid rgba(102, 126, 234, 0.1);
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s;
        }

        #result.show {
            opacity: 1;
            transform: translateY(0);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 15px;
            color: #555;
        }

        .result-row .label {
            font-weight: 500;
        }

        .result-row .value {
            font-weight: 700;
            color: #667eea;
            font-size: 18px;
        }

        .result-row.total {
            border-top: 2px dashed #d0d4f0;
            margin-top: 8px;
            padding-top: 14px;
        }

        .result-row.total .value {
            color: #764ba2;
            font-size: 24px;
        }

        .placeholder-text {
            color: #999;
            font-size: 14px;
            text-align: center;
        }

        .emoji {
            font-size: 48px;
            text-align: center;
            margin-bottom: 8px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 24px;
                border-radius: 20px;
            }
            h1 {
                font-size: 26px;
            }
            .tip-btn {
                min-width: 50px;
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">🧮</div>
        <h1>Tip Calculator</h1>
        <p class="subtitle">Quickly calculate tips and split bills</p>

        <div class="form-group">
            <label for="bill">Bill Amount</label>
            <div class="input-wrapper">
                <span class="input-icon">$</span>
                <input type="number" id="bill" placeholder="0.00" step="0.01" min="0">
            </div>
        </div>

        <div class="form-group">
            <label>Select Tip %</label>
            <div class="tip-options">
                <button class="tip-btn" data-tip="10">10%</button>
                <button class="tip-btn active" data-tip="15">15%</button>
                <button class="tip-btn" data-tip="20">20%</button>
                <button class="tip-btn" data-tip="25">25%</button>
            </div>
        </div>

        <div class="form-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" class="people-input" placeholder="1" min="1" step="1" value="1">
        </div>

        <button id="calculate">Calculate</button>

        <div id="error" class="error-area"></div>

        <div id="result">
            <span class="placeholder-text">Enter details and click Calculate to see results.</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
